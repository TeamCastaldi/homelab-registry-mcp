---
# This role runs `docker compose` on its target, so the test instance needs
# a real Docker daemon of its own (Docker-in-Docker) — prepare.yml installs
# and starts it. Requires --privileged and the cgroup mount below for the
# inner dockerd to run at all.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: docker-stack-deploy-instance
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # Excludes idempotence (the only change from Molecule's default
  # sequence). docker-stack-deploy's own tasks/main.yml hardcodes
  # changed_when: true on both `docker compose pull` and `up -d` --
  # a deliberate, pre-existing design choice (avoids parsing compose's
  # own output to infer idempotency), not a bug this scenario should
  # paper over or "fix" by rewriting the role's behavior. Molecule's
  # idempotence stage converges twice and requires zero changes on the
  # second run, which this role's own design can never satisfy.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
