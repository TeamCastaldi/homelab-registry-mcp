---
# plumbing-check — defaults
#
# Every variable this role uses has a default here, so it runs against any
# node with no extra-vars required. plumbing_check_service_name is
# deliberately unset (~) — the service-status report step is skipped
# entirely rather than failing when no service name is given.

plumbing_check_diagnostic_command: uptime
plumbing_check_target_file: /tmp/plumbing-check-marker.txt
plumbing_check_target_file_content: "plumbing-check ran at {{ ansible_date_time.iso8601 | default('unknown time') }}"
plumbing_check_service_name: ~
