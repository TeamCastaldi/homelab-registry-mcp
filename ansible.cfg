[defaults]
# Lets ansible-lint/ansible-playbook find ansible/roles/* by default when run
# from the repo root -- without this, only Ansible's built-in search paths
# apply (<playbook-dir>/roles, ~/.ansible/roles, /usr/share/ansible/roles, ...),
# none of which include this repo's own roles/ directory (a sibling of
# playbooks/, not nested under it). Fixes the "role not found" false positive
# an editor's Ansible extension (or a bare `ansible-lint`/`ansible-playbook`
# invocation) hits without CI's explicit ANSIBLE_ROLES_PATH prefix.
#
# This has no effect on real deploys: `ANSIBLE_ROLES_PATH` (set explicitly in
# .github/workflows/deploy.yml and ci.yml) always takes precedence over this
# file's roles_path, and this file carries no connection settings, inventory,
# or anything operator-specific -- those stay in the operator's own
# ansible.cfg per ansible/README.md.
roles_path = ansible/roles
