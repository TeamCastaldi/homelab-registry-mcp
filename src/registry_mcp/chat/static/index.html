<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab Chat</title>
<style nonce="__CSP_NONCE__">
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e2e2e6;
    --accent: #2563eb;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --assistant-bg: #ffffff;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --chip-bg: #eef2ff;
    --chip-text: #3730a3;
    --gutter: clamp(1rem, 4vw, 4rem);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --panel: #1f2023;
      --text: #e7e7e9;
      --muted: #9aa0a8;
      --border: #303236;
      --accent: #5b8def;
      --user-bg: #2f5fd6;
      --user-text: #ffffff;
      --assistant-bg: #1f2023;
      --error-bg: #3a1d1d;
      --error-text: #f5a3a3;
      --chip-bg: #232640;
      --chip-text: #b7c0ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a;
    --panel: #1f2023;
    --text: #e7e7e9;
    --muted: #9aa0a8;
    --border: #303236;
    --accent: #5b8def;
    --user-bg: #2f5fd6;
    --user-text: #ffffff;
    --assistant-bg: #1f2023;
    --error-bg: #3a1d1d;
    --error-text: #f5a3a3;
    --chip-bg: #232640;
    --chip-text: #b7c0ff;
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem var(--gutter);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  #model-status { font-size: 0.8rem; color: var(--muted); }
  #model-status.ok::before { content: "● "; color: #22c55e; }
  #model-status.err::before { content: "● "; color: #ef4444; }
  header .actions { display: flex; gap: 0.5rem; align-items: center; }
  header button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  header button:hover { background: var(--bg); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem var(--gutter);
    width: 100%;
  }
  .msg { display: flex; margin-bottom: 0.85rem; }
  .msg-user { justify-content: flex-end; }
  .msg-body {
    max-width: min(80%, 60rem);
    padding: 0.55rem 0.8rem;
    border-radius: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-user .msg-body { background: var(--user-bg); color: var(--user-text); }
  .msg-assistant .msg-body { background: var(--assistant-bg); border: 1px solid var(--border); }
  .msg-body p { margin: 0 0 0.5rem; }
  .msg-body p:last-child { margin-bottom: 0; }
  .code-block { position: relative; margin: 0.4rem 0; }
  .msg-body pre {
    background: rgba(127, 127, 127, 0.12);
    border-radius: 8px;
    padding: 0.6rem;
    overflow-x: auto;
    margin: 0;
  }
  .code-block pre { padding-right: 2.6rem; }
  .msg-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85em; }
  .copy-btn {
    position: absolute;
    top: 0.4rem;
    right: 0.4rem;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    padding: 0.15rem 0.4rem;
    font-size: 0.75rem;
    line-height: 1.3;
    cursor: pointer;
    color: var(--muted);
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .msg-error .msg-body { background: var(--error-bg); color: var(--error-text); border: none; }
  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--chip-bg);
    color: var(--chip-text);
    border-radius: 999px;
    padding: 0.2rem 0.65rem;
    font-size: 0.75rem;
    margin: 0 0 0.5rem;
  }
  .tool-chip.fail { opacity: 0.7; text-decoration: line-through; }
  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .chip {
    font: inherit;
    font-size: 0.8rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--chip-text);
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .chip:disabled { opacity: 0.5; cursor: default; }
  #quick-actions-toggle {
    display: none;
    font: inherit;
    font-size: 0.8rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--chip-text);
    border: 1px solid var(--border);
    cursor: pointer;
    margin-bottom: 0.6rem;
  }
  @media (max-width: 640px) {
    #quick-actions-toggle { display: inline-block; }
    .quick-actions { display: none; }
    .quick-actions.open { display: flex; }
  }
  .msg-thinking .msg-body { display: flex; align-items: center; gap: 0.3rem; }
  .msg-thinking .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: thinking-bounce 1.2s infinite ease-in-out;
  }
  .msg-thinking .dot:nth-child(2) { animation-delay: 0.2s; }
  .msg-thinking .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes thinking-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  details.thinking {
    max-width: min(80%, 60rem);
    margin: 0 0 0.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  details.thinking summary { cursor: pointer; }
  details.thinking pre {
    white-space: pre-wrap;
    background: rgba(127, 127, 127, 0.08);
    border-radius: 8px;
    padding: 0.5rem;
  }
  #hint {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    margin-top: 2rem;
  }
  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 0.75rem var(--gutter);
  }
  #attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  #attachments:empty { display: none; }
  .attachment-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--chip-bg);
    color: var(--chip-text);
    border-radius: 999px;
    padding: 0.2rem 0.5rem 0.2rem 0.7rem;
    font-size: 0.75rem;
  }
  .attachment-chip button {
    background: transparent;
    border: none;
    color: inherit;
    cursor: pointer;
    font-size: 0.9em;
    padding: 0 0.2rem;
    line-height: 1;
  }
  #composer {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.75rem;
    font: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 8rem;
  }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.6rem 1rem;
    font: inherit;
    cursor: pointer;
  }
  #composer button#attach-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  #composer button:disabled { opacity: 0.5; cursor: default; }
  #status {
    margin: 0.3rem 0 0;
    font-size: 0.75rem;
    color: var(--muted);
    min-height: 1em;
  }
</style>
</head>
<body>
<header>
  <h1>Homelab Chat</h1>
  <div class="actions">
    <span id="model-status">checking…</span>
    <button id="new-chat" type="button">New chat</button>
    <button id="sign-out" type="button">Sign out</button>
    <button id="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>

<div id="messages">
  <p id="hint">Ask about your lab — services, hardware, staleness, routing — or just talk through an idea.</p>
</div>

<footer>
  <button id="quick-actions-toggle" type="button" aria-expanded="false" aria-controls="quick-actions">☰ Quick actions</button>
  <div id="quick-actions" class="quick-actions">
    <button type="button" class="chip" data-prompt="If the discovery_run_now tool is available to you, call it first to trigger a fresh scan. Then report the discovery status across Traefik, Docker, and Authentik.">Discovery status</button>
    <button type="button" class="chip" data-prompt="List any open proposals awaiting review.">Open proposals</button>
    <button type="button" class="chip" data-prompt="Which services are currently marked stale, and why?">Stale services</button>
    <button type="button" class="chip" data-prompt-id="troubleshoot">Troubleshoot</button>
  </div>
  <div id="attachments"></div>
  <form id="composer">
    <input type="file" id="file-input" multiple hidden
      accept=".yaml,.yml,.txt,.json,.log,.conf,.md,.sh,.py,.toml,.ini,.cfg">
    <button id="attach-btn" type="button" title="Attach a text file" aria-label="Attach a text file">📎</button>
    <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
    <button id="send-btn" type="submit">Send</button>
  </form>
  <div id="status"></div>
</footer>

<script nonce="__CSP_NONCE__">
(() => {
  "use strict";
  // Safe markdown rendering for assistant chat output. Text in, real DOM
  // nodes out via createElement/textContent only — never innerHTML — so
  // lab-sourced data a model reply might echo (a Traefik router rule, a
  // service note, an IdP application name) can never be interpreted as
  // markup. Kept in its own script block, isolated from the rest of the
  // app until the wiring commit lands (see index.html's git history /
  // the PR this shipped in). Marker-delimited so
  // tests/chat_markdown.test.mjs (`node --test`) can extract this source
  // and exercise it directly without a build step.

  // ---- markdown-render:start ----

  // Phase 1 — tokenizer/parser: a plain string in, a plain-data node tree
  // out. No DOM access here by design: a parser bug can never itself be an
  // injection vector if it never touches the DOM at all. Deliberately no
  // `_text_` italics: naive underscore-based emphasis corrupts snake_case
  // identifiers (env vars, hostnames) that show up constantly in this
  // domain's chat output, so only `*text*` is recognized for italics.

  function mdParseInline(text) {
    const nodes = [];
    let buf = "";
    let i = 0;
    const n = text.length;

    function flush() {
      if (buf) {
        nodes.push({ type: "text", value: buf });
        buf = "";
      }
    }

    while (i < n) {
      const ch = text[i];

      if (ch === "`") {
        const end = text.indexOf("`", i + 1);
        if (end !== -1) {
          flush();
          nodes.push({ type: "code_inline", value: text.slice(i + 1, end) });
          i = end + 1;
          continue;
        }
      }

      if (ch === "*" && text[i + 1] === "*") {
        const end = text.indexOf("**", i + 2);
        if (end !== -1 && end > i + 2) {
          flush();
          nodes.push({ type: "bold", children: mdParseInline(text.slice(i + 2, end)) });
          i = end + 2;
          continue;
        }
        // Unterminated (or empty, "****") "**": both asterisks are
        // literal. Consume them together — falling through one char at a
        // time would let the second "*" be picked up fresh as an italic
        // opener/closer on the next iteration (e.g. "**a*" would wrongly
        // italicize "a" instead of staying fully literal).
        buf += "**";
        i += 2;
        continue;
      }

      if (ch === "*" && text[i + 1] !== "*") {
        // Scan for a closing single `*`, but treat any `**...**` run
        // encountered along the way as an atomic (nested bold) unit rather
        // than letting its first `*` prematurely close the italic span —
        // otherwise `*a **b** c*` closes after "a " instead of spanning
        // the whole thing.
        let j = i + 1;
        let end = -1;
        while (j < n) {
          if (text[j] === "*" && text[j + 1] === "*") {
            const innerEnd = text.indexOf("**", j + 2);
            if (innerEnd === -1) {
              // Unterminated nested "**": skip both chars as a unit, same
              // reasoning as the top-level bold check above — neither may
              // be reinterpreted as the italic closer on its own.
              j += 2;
              continue;
            }
            j = innerEnd + 2;
            continue;
          }
          if (text[j] === "*") {
            end = j;
            break;
          }
          j += 1;
        }
        if (end !== -1 && end > i + 1) {
          flush();
          nodes.push({ type: "italic", children: mdParseInline(text.slice(i + 1, end)) });
          i = end + 1;
          continue;
        }
      }

      if (ch === "[") {
        const closeBracket = text.indexOf("]", i + 1);
        if (closeBracket !== -1 && text[closeBracket + 1] === "(") {
          // Depth-tracked, not indexOf(")"): a URL commonly contains its
          // own parens (a Wikipedia-style path, a javascript: call), and
          // stopping at the first ")" would truncate the href.
          let depth = 1;
          let j = closeBracket + 2;
          while (j < n && depth > 0) {
            if (text[j] === "(") depth++;
            else if (text[j] === ")") depth--;
            if (depth === 0) break;
            j++;
          }
          if (depth === 0) {
            flush();
            nodes.push({
              type: "link",
              href: text.slice(closeBracket + 2, j),
              children: [{ type: "text", value: text.slice(i + 1, closeBracket) }],
            });
            i = j + 1;
            continue;
          }
        }
      }

      buf += ch;
      i += 1;
    }
    flush();
    return nodes;
  }

  function mdIsTableSeparator(line) {
    // Require 3+ dashes per cell (the "---" convention virtually every
    // markdown table — including model output — actually uses), not GFM's
    // bare minimum of 1. A single dash is loose enough to misfire on
    // ordinary prose containing a "|" (e.g. "cost - | benefit -").
    return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(line);
  }

  function mdSplitTableRow(line) {
    let s = line.trim();
    if (s.startsWith("|")) s = s.slice(1);
    if (s.endsWith("|")) s = s.slice(0, -1);
    return s.split("|").map((c) => c.trim());
  }

  function mdStartsBlock(lines, idx) {
    const line = lines[idx];
    if (/^#{1,3}\s+/.test(line)) return true;
    if (/^\s{0,3}(`{3,}|~{3,})/.test(line)) return true;
    if (/^\s{0,3}([-*+]|\d+\.)\s+/.test(line)) return true;
    if (line.includes("|") && idx + 1 < lines.length && mdIsTableSeparator(lines[idx + 1])) {
      return true;
    }
    return false;
  }

  function mdParseBlocks(text) {
    const lines = text.replace(/\r\n/g, "\n").split("\n");
    const blocks = [];
    const n = lines.length;
    let i = 0;

    while (i < n) {
      const line = lines[i];

      if (line.trim() === "") {
        i++;
        continue;
      }

      const fenceMatch = line.match(/^\s{0,3}(`{3,}|~{3,})\s*([^`~\s]*)\s*$/);
      if (fenceMatch) {
        const fence = fenceMatch[1];
        const fenceChar = fence[0];
        const fenceLen = fence.length;
        const lang = fenceMatch[2] || null;
        const closeRe = new RegExp("^\\s{0,3}" + fenceChar + "{" + fenceLen + ",}\\s*$");
        const codeLines = [];
        i++;
        while (i < n && !closeRe.test(lines[i])) {
          codeLines.push(lines[i]);
          i++;
        }
        if (i < n) i++; // consume the closing fence line, if one was found
        blocks.push({ type: "code_block", lang: lang, value: codeLines.join("\n") });
        continue;
      }

      const headingMatch = line.match(/^(#{1,3})\s+(.*)$/);
      if (headingMatch) {
        blocks.push({
          type: "heading",
          level: headingMatch[1].length,
          children: mdParseInline(headingMatch[2].trim()),
        });
        i++;
        continue;
      }

      if (line.includes("|") && i + 1 < n && mdIsTableSeparator(lines[i + 1])) {
        const headerCells = mdSplitTableRow(line);
        i += 2;
        const rowCells = [];
        while (i < n && lines[i].trim() !== "" && lines[i].includes("|")) {
          rowCells.push(mdSplitTableRow(lines[i]));
          i++;
        }
        blocks.push({
          type: "table",
          headers: headerCells.map((c) => mdParseInline(c)),
          rows: rowCells.map((row) => row.map((c) => mdParseInline(c))),
        });
        continue;
      }

      const listMatch = line.match(/^\s{0,3}([-*+]|\d+\.)\s+(.*)$/);
      if (listMatch) {
        const ordered = /^\d+\.$/.test(listMatch[1]);
        const items = [];
        while (i < n) {
          const m = lines[i].match(/^\s{0,3}([-*+]|\d+\.)\s+(.*)$/);
          if (!m || /^\d+\.$/.test(m[1]) !== ordered) break;
          items.push(mdParseInline(m[2]));
          i++;
        }
        blocks.push({ type: "list", ordered: ordered, items: items });
        continue;
      }

      const paraLines = [line];
      i++;
      while (i < n && lines[i].trim() !== "" && !mdStartsBlock(lines, i)) {
        paraLines.push(lines[i]);
        i++;
      }
      blocks.push({ type: "paragraph", children: mdParseInline(paraLines.join(" ")) });
    }

    return blocks;
  }

  function mdParse(text) {
    return { type: "root", children: mdParseBlocks(String(text)) };
  }

  // ---- markdown-render:end ----

  window.ChatMarkdown = {
    parseMarkdown: mdParse,
  };
})();
</script>
<script nonce="__CSP_NONCE__">
(() => {
  "use strict";

  const messagesEl = document.getElementById("messages");
  const hintEl = document.getElementById("hint");
  const formEl = document.getElementById("composer");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const statusEl = document.getElementById("status");
  const modelStatusEl = document.getElementById("model-status");
  const quickActionsEl = document.getElementById("quick-actions");
  const attachBtn = document.getElementById("attach-btn");
  const fileInputEl = document.getElementById("file-input");
  const attachmentsEl = document.getElementById("attachments");
  const themeToggleBtn = document.getElementById("theme-toggle");
  const quickActionsToggleBtn = document.getElementById("quick-actions-toggle");

  /** @type {Array<{role: string, content?: string, tool_calls?: unknown, tool_name?: string}>} */
  let history = [];

  /** @type {Array<{name: string, content: string}>} */
  let attachments = [];
  const MAX_ATTACHMENTS = 3;
  // Gate on raw byte size before FileReader loads the file into memory —
  // reading first and truncating after would let a huge file be fully read
  // (and freeze the tab) before ever being rejected.
  const MAX_ATTACHMENT_BYTES = 20000;
  // Sized against CHAT_TOOL_RESULT_MAX_CHARS/CHAT_CONTEXT_MAX_CHARS (8000/6000
  // chars) — the model only has CHAT_NUM_CTX=8192 tokens total, so a much
  // larger cap here would silently blow the context budget instead of
  // failing loudly. Applied post-read as a second bound, since multi-byte
  // UTF-8 content means byte count doesn't map 1:1 to char count.
  const MAX_ATTACHMENT_CHARS = 20000;
  const ATTACHMENT_LANGS = {
    yml: "yaml", yaml: "yaml", json: "json", sh: "bash", bash: "bash",
    py: "python", toml: "toml", ini: "ini", cfg: "ini", md: "markdown",
    log: "", txt: "", env: "", conf: "",
  };

  // Long structured prompts live here as templates rather than inline
  // `data-prompt` attributes, so the workflow stays readable/editable and
  // the markup above stays uniform. Referenced by a chip's `data-prompt-id`.
  const PRESET_PROMPTS = {
    troubleshoot: `Let's troubleshoot something that's broken in my homelab. Run this as a structured debugging session: Observe, then Theorize, then Act — one step at a time, checking in with me between each.

Observe: If I haven't already told you what's broken, start by acting as a first-line help desk tech. Ask me clarifying, diagnostic questions one at a time to gather the exact details of the incident. Focus on finding out:
* What is the exact error message or symptom?
* When did it start, and was it working normally before?
* Were there any recent changes, updates, or power events?
* What is the impact (e.g., is just one service down, or the whole node)?

Once you have those answers, shift into systems engineering mode. Leverage the MCP toolkit to proactively gather evidence: check discovery status and staleness, pull the affected service's full context including its router and auth application, look at its recent change and discovery events, check the hardware node it runs on (and capacity if resource exhaustion is plausible), and pull recent logs if it's container-level. Only look up what's relevant to the symptom. 

**Fallback Protocol:** If an MCP tool fails, is unavailable, or does not exist for a piece of evidence you need, do not hallucinate or guess the status. Instead, explicitly state the tool limitation and provide me with the exact CLI commands I need to run manually to gather that data. Format these commands clearly in fenced code blocks and wait for me to paste the output.

Summarize what you found (or what we gathered manually) as Symptom / First seen / Affected scope, and confirm it matches what I'm seeing before moving on.

Theorize: Once I confirm, give me one root-cause theory grounded in what you actually found, not a generic guess. State the theory, the evidence for it, the proposed fix, and the risk. Wait for me to approve it before acting.

Act: Once approved, be precise about what fixing this actually requires. If it's a curated registry field you can update directly via MCP, say so and confirm before doing it. Real service or infra config goes through the GitOps proposal path, not a direct edit — describe the exact change and offer to open a proposal if one makes sense, then wait for my go-ahead. Never fabricate a fix for something you haven't looked up, and never take an irreversible action without me confirming first.

If the fix doesn't work, go back to Observe with the new symptom. When we're done, summarize the root cause and fix in one paragraph, and tell me if the service's notes are worth updating so this doesn't get re-diagnosed from scratch next time.`,
  };

  function el(tag, opts) {
    opts = opts || {};
    const node = document.createElement(tag);
    if (opts.class) node.className = opts.class;
    if (opts.text !== undefined) node.textContent = opts.text;
    return node;
  }

  function scrollToEnd() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Copies `text` to the clipboard. navigator.clipboard requires a secure
  // context; CHAT_COOKIE_SECURE=false documents plain http:// LAN deploys
  // where it's unavailable, so fall back to the legacy execCommand path.
  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const ta = el("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    if (!ok) throw new Error("execCommand('copy') failed");
  }

  // Renders message text as plain text, with ``` fenced blocks split into
  // <pre><code> — via textContent only, never innerHTML. This text may
  // echo lab-sourced data (a service note, a Traefik router rule, an IdP
  // application name), so it is never trusted as markup.
  function renderContent(container, text) {
    container.textContent = "";
    const parts = String(text).split("```");
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const pre = el("pre");
        const code = el("code", { text: part.replace(/^[^\n]*\n/, "") });
        pre.appendChild(code);
        const wrap = el("div", { class: "code-block" });
        wrap.appendChild(pre);
        const copyBtn = el("button", { class: "copy-btn", text: "📋" });
        copyBtn.type = "button";
        copyBtn.title = "Copy";
        copyBtn.setAttribute("aria-label", "Copy code");
        copyBtn.addEventListener("click", () => {
          copyText(code.textContent)
            .then(() => { copyBtn.textContent = "✓"; })
            .catch(() => { copyBtn.textContent = "✕"; })
            .finally(() => {
              setTimeout(() => { copyBtn.textContent = "📋"; }, 1500);
            });
        });
        wrap.appendChild(copyBtn);
        container.appendChild(wrap);
      } else if (part) {
        part.split(/\n{2,}/).forEach((para) => {
          if (para.trim()) container.appendChild(el("p", { text: para }));
        });
      }
    });
  }

  function addMessage(role, text) {
    if (hintEl) hintEl.remove();
    const wrap = el("div", { class: "msg msg-" + role });
    const body = el("div", { class: "msg-body" });
    renderContent(body, text);
    wrap.appendChild(body);
    messagesEl.appendChild(wrap);
    scrollToEnd();
    return body;
  }

  function addToolChip(name) {
    const chip = el("div", { class: "tool-chip", text: "🔧 " + name });
    messagesEl.appendChild(chip);
    scrollToEnd();
    return chip;
  }

  // Animated 3-dot bubble shown while waiting for the first token/tool call
  // of a turn — distinct from `details.thinking`, which renders the model's
  // own streamed reasoning trace once it starts arriving.
  function addThinkingBubble() {
    if (hintEl) hintEl.remove();
    const wrap = el("div", { class: "msg msg-assistant msg-thinking" });
    const body = el("div", { class: "msg-body" });
    body.appendChild(el("span", { class: "dot" }));
    body.appendChild(el("span", { class: "dot" }));
    body.appendChild(el("span", { class: "dot" }));
    wrap.appendChild(body);
    messagesEl.appendChild(wrap);
    scrollToEnd();
    return wrap;
  }

  function setComposerEnabled(enabled) {
    inputEl.disabled = !enabled;
    sendBtn.disabled = !enabled;
    attachBtn.disabled = !enabled;
    quickActionsEl.querySelectorAll(".chip").forEach((b) => (b.disabled = !enabled));
  }

  function renderAttachments() {
    attachmentsEl.textContent = "";
    attachments.forEach((att, idx) => {
      const chip = el("div", { class: "attachment-chip" });
      chip.appendChild(el("span", { text: "📎 " + att.name }));
      const removeBtn = el("button", { text: "✕" });
      removeBtn.type = "button";
      removeBtn.title = "Remove " + att.name;
      removeBtn.setAttribute("aria-label", "Remove " + att.name);
      removeBtn.addEventListener("click", () => {
        attachments.splice(idx, 1);
        renderAttachments();
      });
      chip.appendChild(removeBtn);
      attachmentsEl.appendChild(chip);
    });
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  }

  async function handleFilesSelected(fileList) {
    for (const file of Array.from(fileList)) {
      if (attachments.length >= MAX_ATTACHMENTS) {
        statusEl.textContent = "Attachment limit reached (" + MAX_ATTACHMENTS + " files).";
        break;
      }
      if (file.size === 0) {
        statusEl.textContent = file.name + " is empty, skipped.";
        continue;
      }
      if (file.size > MAX_ATTACHMENT_BYTES) {
        statusEl.textContent = file.name + " is too large (max " + Math.floor(MAX_ATTACHMENT_BYTES / 1000) + "KB), skipped.";
        continue;
      }
      let text;
      try {
        text = await readFileAsText(file);
      } catch (e) {
        statusEl.textContent = "Couldn't read " + file.name + ".";
        continue;
      }
      if (text.includes("\u0000") || text.includes("�")) {
        statusEl.textContent = file.name + " doesn't look like a text file, skipped.";
        continue;
      }
      let truncated = false;
      if (text.length > MAX_ATTACHMENT_CHARS) {
        text = text.slice(0, MAX_ATTACHMENT_CHARS);
        truncated = true;
      }
      attachments.push({ name: file.name, content: text });
      statusEl.textContent = truncated
        ? "Attached " + file.name + " (truncated to " + MAX_ATTACHMENT_CHARS + " chars)."
        : "Attached " + file.name + ".";
    }
    renderAttachments();
  }

  function attachmentLang(name) {
    const ext = name.includes(".") ? name.split(".").pop().toLowerCase() : "";
    return Object.prototype.hasOwnProperty.call(ATTACHMENT_LANGS, ext) ? ATTACHMENT_LANGS[ext] : ext;
  }

  function buildOutgoingText(typed) {
    if (!attachments.length) return typed;
    const blocks = attachments.map(
      (att) => "File: " + att.name + "\n```" + attachmentLang(att.name) + "\n" + att.content + "\n```"
    );
    return blocks.join("\n\n") + (typed ? "\n\n" + typed : "");
  }

  function buildDisplayText(typed) {
    if (!attachments.length) return typed;
    const lines = attachments.map((att) => "📎 " + att.name);
    return (typed ? typed + "\n" : "") + lines.join("\n");
  }

  async function checkHealth() {
    try {
      const resp = await fetch("/chat/api/health");
      const data = await resp.json();
      if (data.ok) {
        modelStatusEl.textContent = data.configured_model;
        modelStatusEl.className = "ok";
      } else {
        modelStatusEl.textContent = "unreachable";
        modelStatusEl.className = "err";
      }
    } catch (e) {
      modelStatusEl.textContent = "unreachable";
      modelStatusEl.className = "err";
    }
  }

  function parseSseFrame(frame) {
    let event = "message";
    const dataLines = [];
    for (const line of frame.split("\n")) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
    }
    let data = {};
    try {
      data = JSON.parse(dataLines.join("\n"));
    } catch (e) {
      return null;
    }
    return { event, data };
  }

  async function send(text, displayText) {
    const outgoingText = buildOutgoingText(text);
    const outgoingDisplay = buildDisplayText(displayText || text);
    attachments = [];
    renderAttachments();
    history.push({ role: "user", content: outgoingText });
    addMessage("user", outgoingDisplay);
    inputEl.value = "";
    inputEl.style.height = "auto";
    setComposerEnabled(false);

    let assistantBody = null;
    let assistantText = "";
    let thinkingEl = null;
    let waitingBubble = addThinkingBubble();

    let resp;
    try {
      resp = await fetch("/chat/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
    } catch (e) {
      if (waitingBubble) waitingBubble.remove();
      addMessage("error", "Network error reaching the server.");
      setComposerEnabled(true);
      return;
    }

    if (!resp.ok || !resp.body) {
      if (waitingBubble) waitingBubble.remove();
      if (resp.status === 401) {
        addMessage("error", "Your session expired. Reload the page to sign in again.");
      } else {
        addMessage("error", "Request failed (" + resp.status + ").");
      }
      setComposerEnabled(true);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      let chunk;
      try {
        chunk = await reader.read();
      } catch (e) {
        break;
      }
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame.trim()) continue;
        const parsed = parseSseFrame(frame);
        if (!parsed) continue;
        const { event, data } = parsed;

        if (event !== "open" && waitingBubble) {
          waitingBubble.remove();
          waitingBubble = null;
        }

        if (event === "open") {
          statusEl.textContent = data.write ? "writes enabled for this session" : "";
        } else if (event === "thinking") {
          if (!thinkingEl) {
            thinkingEl = el("details", { class: "thinking" });
            thinkingEl.appendChild(el("summary", { text: "thinking…" }));
            thinkingEl.appendChild(el("pre", { text: "" }));
            messagesEl.appendChild(thinkingEl);
          }
          const pre = thinkingEl.querySelector("pre");
          pre.textContent += data.delta || "";
          scrollToEnd();
        } else if (event === "token") {
          if (!assistantBody) assistantBody = addMessage("assistant", "");
          assistantText += data.delta || "";
          renderContent(assistantBody, assistantText);
          scrollToEnd();
        } else if (event === "tool_call") {
          addToolChip(data.name || "tool");
        } else if (event === "tool_result") {
          // Chips are fire-and-forget for now; a failed call still shows
          // up in the assistant's next reply.
        } else if (event === "error") {
          addMessage("error", data.message || ("Error: " + (data.kind || "unknown")));
        } else if (event === "done") {
          history = history.concat(Array.isArray(data.messages) ? data.messages : []);
          assistantBody = null;
          assistantText = "";
          thinkingEl = null;
        }
      }
    }

    if (waitingBubble) waitingBubble.remove();
    statusEl.textContent = "";
    setComposerEnabled(true);
    inputEl.focus();
  }

  attachBtn.addEventListener("click", () => {
    if (attachBtn.disabled) return;
    fileInputEl.click();
  });

  fileInputEl.addEventListener("change", () => {
    if (fileInputEl.files && fileInputEl.files.length) {
      handleFilesSelected(fileInputEl.files);
    }
    fileInputEl.value = "";
  });

  quickActionsEl.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      if (chip.disabled) return;
      const prompt = chip.dataset.promptId ? PRESET_PROMPTS[chip.dataset.promptId] : chip.dataset.prompt;
      send(prompt, chip.textContent);
      quickActionsEl.classList.remove("open");
      quickActionsToggleBtn.setAttribute("aria-expanded", "false");
    });
  });

  quickActionsToggleBtn.addEventListener("click", () => {
    const isOpen = quickActionsEl.classList.toggle("open");
    quickActionsToggleBtn.setAttribute("aria-expanded", String(isOpen));
  });

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text && !attachments.length) return;
    send(text);
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 128) + "px";
  });

  document.getElementById("new-chat").addEventListener("click", () => {
    history = [];
    messagesEl.textContent = "";
    messagesEl.appendChild(hintEl || el("p", { class: "hint" }));
  });

  document.getElementById("sign-out").addEventListener("click", async () => {
    await fetch("/chat/auth/logout", { method: "POST" });
    window.location.href = "/chat/auth/login";
  });

  // Explicit light/dark override on top of the prefers-color-scheme default
  // (see the :root[data-theme] rules in <style>), persisted in localStorage.
  // No stored preference means "follow system" — no data-theme attribute set.
  const THEME_KEY = "chat-theme";
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

  function currentTheme() {
    const stored = localStorage.getItem(THEME_KEY);
    if (stored === "light" || stored === "dark") return stored;
    return prefersDark.matches ? "dark" : "light";
  }

  function updateThemeToggleIcon() {
    const isDark = currentTheme() === "dark";
    themeToggleBtn.textContent = isDark ? "☀️" : "🌙";
    const label = isDark ? "Switch to light theme" : "Switch to dark theme";
    themeToggleBtn.title = label;
    themeToggleBtn.setAttribute("aria-label", label);
  }

  const storedTheme = localStorage.getItem(THEME_KEY);
  if (storedTheme === "light" || storedTheme === "dark") {
    document.documentElement.dataset.theme = storedTheme;
  }
  updateThemeToggleIcon();

  themeToggleBtn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    document.documentElement.dataset.theme = next;
    updateThemeToggleIcon();
  });

  checkHealth();
})();
</script>
</body>
</html>
