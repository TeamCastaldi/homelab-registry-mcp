<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab Chat</title>
<style nonce="__CSP_NONCE__">
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e2e2e6;
    --accent: #2563eb;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --assistant-bg: #ffffff;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --chip-bg: #eef2ff;
    --chip-text: #3730a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1f2023;
      --text: #e7e7e9;
      --muted: #9aa0a8;
      --border: #303236;
      --accent: #5b8def;
      --user-bg: #2f5fd6;
      --user-text: #ffffff;
      --assistant-bg: #1f2023;
      --error-bg: #3a1d1d;
      --error-text: #f5a3a3;
      --chip-bg: #232640;
      --chip-text: #b7c0ff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  #model-status { font-size: 0.8rem; color: var(--muted); }
  #model-status.ok::before { content: "● "; color: #22c55e; }
  #model-status.err::before { content: "● "; color: #ef4444; }
  header .actions { display: flex; gap: 0.5rem; align-items: center; }
  header button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  header button:hover { background: var(--bg); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; margin-bottom: 0.85rem; }
  .msg-user { justify-content: flex-end; }
  .msg-body {
    max-width: 80%;
    padding: 0.55rem 0.8rem;
    border-radius: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-user .msg-body { background: var(--user-bg); color: var(--user-text); }
  .msg-assistant .msg-body { background: var(--assistant-bg); border: 1px solid var(--border); }
  .msg-body p { margin: 0 0 0.5rem; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body pre {
    background: rgba(127, 127, 127, 0.12);
    border-radius: 8px;
    padding: 0.6rem;
    overflow-x: auto;
    margin: 0.4rem 0;
  }
  .msg-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85em; }
  .msg-error .msg-body { background: var(--error-bg); color: var(--error-text); border: none; }
  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--chip-bg);
    color: var(--chip-text);
    border-radius: 999px;
    padding: 0.2rem 0.65rem;
    font-size: 0.75rem;
    margin: 0 0 0.5rem;
  }
  .tool-chip.fail { opacity: 0.7; text-decoration: line-through; }
  details.thinking {
    max-width: 80%;
    margin: 0 0 0.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  details.thinking summary { cursor: pointer; }
  details.thinking pre {
    white-space: pre-wrap;
    background: rgba(127, 127, 127, 0.08);
    border-radius: 8px;
    padding: 0.5rem;
  }
  #hint {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    margin-top: 2rem;
  }
  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 0.75rem 1rem;
  }
  #composer {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.75rem;
    font: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 8rem;
  }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.6rem 1rem;
    font: inherit;
    cursor: pointer;
  }
  #composer button:disabled { opacity: 0.5; cursor: default; }
  #status {
    max-width: 720px;
    margin: 0.3rem auto 0;
    font-size: 0.75rem;
    color: var(--muted);
    min-height: 1em;
  }
</style>
</head>
<body>
<header>
  <h1>Homelab Chat</h1>
  <div class="actions">
    <span id="model-status">checking…</span>
    <button id="new-chat" type="button">New chat</button>
    <button id="sign-out" type="button">Sign out</button>
  </div>
</header>

<div id="messages">
  <p id="hint">Ask about your lab — services, hardware, staleness, routing — or just talk through an idea.</p>
</div>

<footer>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
    <button id="send-btn" type="submit">Send</button>
  </form>
  <div id="status"></div>
</footer>

<script nonce="__CSP_NONCE__">
(() => {
  "use strict";

  const messagesEl = document.getElementById("messages");
  const hintEl = document.getElementById("hint");
  const formEl = document.getElementById("composer");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const statusEl = document.getElementById("status");
  const modelStatusEl = document.getElementById("model-status");

  /** @type {Array<{role: string, content?: string, tool_calls?: unknown, tool_name?: string}>} */
  let history = [];

  function el(tag, opts) {
    opts = opts || {};
    const node = document.createElement(tag);
    if (opts.class) node.className = opts.class;
    if (opts.text !== undefined) node.textContent = opts.text;
    return node;
  }

  function scrollToEnd() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Renders message text as plain text, with ``` fenced blocks split into
  // <pre><code> — via textContent only, never innerHTML. This text may
  // echo lab-sourced data (a service note, a Traefik router rule, an IdP
  // application name), so it is never trusted as markup.
  function renderContent(container, text) {
    container.textContent = "";
    const parts = String(text).split("```");
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const pre = el("pre");
        const code = el("code", { text: part.replace(/^[^\n]*\n/, "") });
        pre.appendChild(code);
        container.appendChild(pre);
      } else if (part) {
        part.split(/\n{2,}/).forEach((para) => {
          if (para.trim()) container.appendChild(el("p", { text: para }));
        });
      }
    });
  }

  function addMessage(role, text) {
    if (hintEl) hintEl.remove();
    const wrap = el("div", { class: "msg msg-" + role });
    const body = el("div", { class: "msg-body" });
    renderContent(body, text);
    wrap.appendChild(body);
    messagesEl.appendChild(wrap);
    scrollToEnd();
    return body;
  }

  function addToolChip(name) {
    const chip = el("div", { class: "tool-chip", text: "🔧 " + name });
    messagesEl.appendChild(chip);
    scrollToEnd();
    return chip;
  }

  async function checkHealth() {
    try {
      const resp = await fetch("/chat/api/health");
      const data = await resp.json();
      if (data.ok) {
        modelStatusEl.textContent = data.configured_model;
        modelStatusEl.className = "ok";
      } else {
        modelStatusEl.textContent = "unreachable";
        modelStatusEl.className = "err";
      }
    } catch (e) {
      modelStatusEl.textContent = "unreachable";
      modelStatusEl.className = "err";
    }
  }

  function parseSseFrame(frame) {
    let event = "message";
    const dataLines = [];
    for (const line of frame.split("\n")) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
    }
    let data = {};
    try {
      data = JSON.parse(dataLines.join("\n"));
    } catch (e) {
      return null;
    }
    return { event, data };
  }

  async function send(text) {
    history.push({ role: "user", content: text });
    addMessage("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    inputEl.disabled = true;
    sendBtn.disabled = true;
    statusEl.textContent = "thinking…";

    let assistantBody = null;
    let assistantText = "";
    let thinkingEl = null;

    let resp;
    try {
      resp = await fetch("/chat/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
    } catch (e) {
      statusEl.textContent = "";
      addMessage("error", "Network error reaching the server.");
      inputEl.disabled = false;
      sendBtn.disabled = false;
      return;
    }

    if (!resp.ok || !resp.body) {
      statusEl.textContent = "";
      if (resp.status === 401) {
        addMessage("error", "Your session expired. Reload the page to sign in again.");
      } else {
        addMessage("error", "Request failed (" + resp.status + ").");
      }
      inputEl.disabled = false;
      sendBtn.disabled = false;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      let chunk;
      try {
        chunk = await reader.read();
      } catch (e) {
        break;
      }
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame.trim()) continue;
        const parsed = parseSseFrame(frame);
        if (!parsed) continue;
        const { event, data } = parsed;

        if (event === "open") {
          statusEl.textContent = data.write ? "writes enabled for this session" : "";
        } else if (event === "thinking") {
          if (!thinkingEl) {
            thinkingEl = el("details", { class: "thinking" });
            thinkingEl.appendChild(el("summary", { text: "thinking…" }));
            thinkingEl.appendChild(el("pre", { text: "" }));
            messagesEl.appendChild(thinkingEl);
          }
          const pre = thinkingEl.querySelector("pre");
          pre.textContent += data.delta || "";
          scrollToEnd();
        } else if (event === "token") {
          if (!assistantBody) assistantBody = addMessage("assistant", "");
          assistantText += data.delta || "";
          renderContent(assistantBody, assistantText);
          scrollToEnd();
        } else if (event === "tool_call") {
          addToolChip(data.name || "tool");
        } else if (event === "tool_result") {
          // Chips are fire-and-forget for now; a failed call still shows
          // up in the assistant's next reply.
        } else if (event === "error") {
          addMessage("error", data.message || ("Error: " + (data.kind || "unknown")));
        } else if (event === "done") {
          history = history.concat(Array.isArray(data.messages) ? data.messages : []);
          assistantBody = null;
          assistantText = "";
          thinkingEl = null;
        }
      }
    }

    statusEl.textContent = "";
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    send(text);
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 128) + "px";
  });

  document.getElementById("new-chat").addEventListener("click", () => {
    history = [];
    messagesEl.textContent = "";
    messagesEl.appendChild(hintEl || el("p", { class: "hint" }));
  });

  document.getElementById("sign-out").addEventListener("click", async () => {
    await fetch("/chat/auth/logout", { method: "POST" });
    window.location.href = "/chat/auth/login";
  });

  checkHealth();
})();
</script>
</body>
</html>
