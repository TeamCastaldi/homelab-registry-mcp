# Glance (glanceapp/glance) — mobile-optimized daily start page, ADR-005 §3.
# Content-focused: RSS/links/weather. Customize freely; unlike Homepage this
# page carries no infra credentials.
pages:
  - name: Home
    columns:
      - size: full
        widgets:
          - type: rss
            title: Homelab release notes
            feeds:
              - url: https://github.com/TeamCastaldi/homelab-registry-mcp/releases.atom
          - type: bookmarks
            groups:
              - title: Homelab
                links:
                  - title: Homepage (control plane)
                    url: "http://localhost:3000"
