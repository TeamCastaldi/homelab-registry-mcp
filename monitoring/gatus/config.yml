# Gatus synthetic uptime config (ADR-005). Seeded with a self-check against
# homelab-registry-mcp; add further endpoints for other LAN services as they
# come under management. Reuses the same SMTP relay as the proposal-engine
# notifications (NOTIFICATION_SMTP_*) via env var substitution.
alerting:
  email:
    from: ${NOTIFICATION_FROM_EMAIL}
    host: ${NOTIFICATION_SMTP_HOST}
    port: ${NOTIFICATION_SMTP_PORT}
    to: ${NOTIFICATION_TO_EMAIL}
    username: ${NOTIFICATION_SMTP_USERNAME}
    password: ${NOTIFICATION_SMTP_PASSWORD}

endpoints:
  - name: homelab-registry-mcp
    url: "http://homelab-registry-mcp:8765/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
