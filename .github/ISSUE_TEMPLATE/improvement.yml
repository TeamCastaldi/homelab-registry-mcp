name: Improvement
description: Refine something that already works.
labels: ["type:improvement", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Start the title with a verb: "Speed up search results", not "Search". Priority is set at triage, when this moves out of backlog.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What exists today, and what is wrong with it or missing from it?
    validations:
      required: true
  - type: textarea
    id: user-story
    attributes:
      label: User story
      placeholder: As a <kind of user>, I want to <action> so that <value>.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What "done" looks like, one checkbox per criterion.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be finished first, as `#N`, one per line. Leave empty if there are none.
      placeholder: "Blocked by #12"
