name: Skills CI

# Tests the tooling under .claude/skills/ — the scripts those skills call, and
# the layout a skill must follow to load at all. Deliberately worded to stay
# true in a scaffolded project as well: this file travels with the skills it
# covers, so it must not claim to be testing a template.
#
# This is not the application's CI. init-project writes that separately as
# ci.yml, and the two coexist; only a project that drops .claude/skills/
# entirely should drop this workflow too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships on the ubuntu-latest image, so no install step.
      - name: Lint shell scripts
        run: |
          mapfile -t scripts < <(find . -path ./.git -prune -o -type f -name '*.sh' -print)
          printf 'Linting %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Validate skill layout
        run: bash scripts/validate_skills.sh

      - name: Test validate_skills.sh
        run: bash scripts/test_validate_skills.sh

      - name: Check documentation claims
        run: bash scripts/check_doc_claims.sh

      - name: Test check_inherited_docs.sh
        run: bash .claude/skills/init-project/scripts/test_check_inherited_docs.sh

      - name: Test compare_template.sh
        run: bash .claude/skills/sync-from-template/scripts/test_compare_template.sh

      - name: Test check_doc_claims.sh
        run: bash scripts/test_check_doc_claims.sh

      - name: Test check_scaffolded_project.sh
        run: bash scripts/test_check_scaffolded_project.sh

      - name: Test sync_labels.sh
        run: bash scripts/test_sync_labels.sh

      - name: Test check_issues.sh
        run: bash scripts/test_check_issues.sh

      - name: Test session-start-hook.sh
        run: bash .claude/hooks/test_session-start-hook.sh

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned via requirements-dev.txt rather than installed with --upgrade:
      # the linter version *is* the ruleset, so letting it float turns an
      # upstream release into a red build on a PR that changed no Python.
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python scripts
        run: ruff check .claude/skills

      - name: Test skill scripts
        run: python -m pytest .claude/skills -q
