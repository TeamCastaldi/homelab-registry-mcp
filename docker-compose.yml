services:
  homelab-registry-mcp:
    image: ghcr.io/teamcastaldi/homelab-registry-mcp:${REGISTRY_MCP_VERSION:-latest}
    container_name: homelab-registry-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      DOCKER_BASE_URL: unix:///var/run/docker.sock
    ports:
      # Bind on all interfaces too, not just the `traefik` network below —
      # keeps direct LAN/debug access to :8765 working regardless of how
      # Traefik is reaching this container.
      - "0.0.0.0:8765:8765"
    # Traefik now runs on this same node (ADR-006), GitOps-managed as its own
    # nodes/<node>/traefik/compose.yaml in the operator's private homelab repo
    # (ADR-007) — it reads the local Docker socket directly and discovers
    # routes via labels. Supersedes the old cross-host static backend from
    # docs/plans/phase-d.md, written back when Traefik lived on a separate
    # workload node. Requires the external `traefik` Docker network to
    # already exist (normally created by that Traefik compose project) —
    # see CLAUDE.md's Docker/Homelab Deploy pre-reqs.
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.registry-mcp.rule: "Host(`registry-mcp.<your-domain>`)"
      traefik.http.routers.registry-mcp.entrypoints: "websecure"
      # TLS on, no ACME resolver by default — Traefik falls back to its
      # self-signed default cert, so this works out of the box (with a
      # browser warning) rather than erroring on a placeholder resolver
      # name. Uncomment the next line and set it to your own Traefik
      # instance's certresolver name for a real cert (ADR-006 Open Item:
      # TLS/ACME config is operator-supplied, "bring your own certs" —
      # not decided in this repo).
      traefik.http.routers.registry-mcp.tls: "true"
      # traefik.http.routers.registry-mcp.tls.certresolver: "<your-certresolver-name>"
      traefik.http.services.registry-mcp.loadbalancer.server.port: "8765"
    volumes:
      - registry-data:/data
      # Homelab repo (git-crypt encrypted .env files + Ansible inventory).
      # Lives on the Pi's local filesystem — GitHub is the backup, not the NAS.
      # Path must match SECRETS_REPO_PATH in .env.
      - /opt/homelab:/opt/homelab:rw
      # Read-only Docker socket: lets DockerDiscoverySource enumerate containers
      # with traefik.enable=true. Discovery is gated on DOCKER_BASE_URL below.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # SSH private key Ansible uses to reach workload nodes (hardware-discover-now's
      # fact-gather + Phase 7 adoption's SSH inspection) — same path in and out, like
      # /opt/homelab above, so it must match SSH_KEY_PATH in .env exactly. Falls back
      # to a harmless /dev/null-onto-itself mount when SSH_KEY_PATH is unset, so this
      # line is a no-op for operators not using either feature.
      - ${SSH_KEY_PATH:-/dev/null}:${SSH_KEY_PATH:-/dev/null}:ro

volumes:
  registry-data:

networks:
  # Created by the operator's Traefik compose project (nodes/<node>/traefik/
  # in the private homelab repo, per ADR-007) — not owned by this file.
  traefik:
    external: true
