services:
  homelab-registry-mcp:
    image: ghcr.io/teamcastaldi/homelab-registry-mcp:${REGISTRY_MCP_VERSION:-latest}
    container_name: homelab-registry-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      DOCKER_BASE_URL: unix:///var/run/docker.sock
    ports:
      # Bind on all interfaces so Traefik on the workload node can reach this
      # container over the LAN. Routing is via a static backend in Traefik's
      # dynamic config (see docs/plans/phase-d.md) — no Docker label discovery
      # is used on the control-plane node.
      - "0.0.0.0:8765:8765"
    volumes:
      - registry-data:/data
      # Homelab repo (git-crypt encrypted .env files + Ansible inventory).
      # Lives on the Pi's local filesystem — GitHub is the backup, not the NAS.
      # Path must match SECRETS_REPO_PATH in .env.
      - /opt/homelab:/opt/homelab:rw
      # Read-only Docker socket: lets DockerDiscoverySource enumerate containers
      # with traefik.enable=true. Discovery is gated on DOCKER_BASE_URL below.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # SSH private key Ansible uses to reach workload nodes (hardware-discover-now's
      # fact-gather + Phase 7 adoption's SSH inspection) — same path in and out, like
      # /opt/homelab above, so it must match SSH_KEY_PATH in .env exactly. Falls back
      # to a harmless /dev/null-onto-itself mount when SSH_KEY_PATH is unset, so this
      # line is a no-op for operators not using either feature.
      - ${SSH_KEY_PATH:-/dev/null}:${SSH_KEY_PATH:-/dev/null}:ro

  # =====================================================================
  # ADR-006 Pi non-MCP services: Komodo (container management, logs, update
  # detection for this node) and Traefik (this node's central ingress).
  # Each is its own Compose profile — add "komodo" and/or "traefik" to
  # COMPOSE_PROFILES in .env (scripts/install.sh does this when the
  # relevant prompts aren't skipped) — so a bare `docker compose up -d` with
  # no profile set only brings up homelab-registry-mcp, unchanged from
  # before. Supersedes the ADR-005 stack (Beszel, Gatus, Dozzle, WUD,
  # Homepage, Glance, docker-socket-proxy, traefik-kop, Autorestic,
  # Healthchecks.io) — see docs/ARDs/ADR-006-Pi-Non-MCP-Services-Komodo-Traefik.md.
  # =====================================================================

  # Komodo's own datastore — not the registry's SQLite, a separate Mongo
  # instance Komodo Core owns entirely. The komodo.skip label keeps Komodo's
  # own "stop all containers" action from stopping its own database.
  # Pinned to the major version (unlike Komodo's own reference compose,
  # which uses bare `mongo`) for reproducible installs, consistent with
  # every other image in this file.
  # KOMODO_DATABASE_PASSWORD/KOMODO_WEBHOOK_SECRET/KOMODO_JWT_SECRET/
  # TRAEFIK_REDIS_PASSWORD below default to blank rather than failing via
  # Compose's `${VAR:?...}` required-variable syntax: Compose interpolates
  # every service's variables up front regardless of which profiles are
  # requested, so a `:?` on any of these would break the base, no-profile
  # `docker compose up -d` for every operator, not just fail closed when
  # "komodo"/"traefik" is enabled (verified empirically — a minimal
  # profiled service with a `:?` var fails `compose config` even with no
  # `--profile` flag passed at all). `install.sh` always generates real
  # values for these before writing `.env` when the corresponding profile
  # is enabled — the blank default here only matters for a `.env` hand-
  # edited outside that flow, same residual risk this file already
  # accepted for the ADR-005 stack's equivalent secrets.
  komodo-mongo:
    image: mongo:7
    container_name: komodo-mongo
    restart: unless-stopped
    profiles: ["komodo"]
    labels:
      komodo.skip: "true"
    command: --quiet --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:-}
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb

  komodo-core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: komodo-core
    init: true
    restart: unless-stopped
    profiles: ["komodo"]
    depends_on:
      - komodo-mongo
    ports:
      - "0.0.0.0:9120:9120"
    environment:
      KOMODO_DATABASE_ADDRESS: "komodo-mongo:27017"
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:-admin}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD:-}
      KOMODO_HOST: ${KOMODO_HOST:-}
      KOMODO_PERIPHERY_PUBLIC_KEY: "file:/config/keys/periphery.pub"
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME:-admin}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD:-}
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_FIRST_SERVER_NAME:-control-plane}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET:-}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET:-}
    volumes:
      # Core/Periphery communication keypair, generated on first boot.
      - komodo-keys:/config/keys
      - komodo-backups:/backups

  # Deployed as a container (Core's own supported option) rather than a
  # systemd binary, consistent with how the rest of this stack runs.
  # Manages the Pi's own local containers — this is what replaces Beszel/
  # Dozzle/WUD/Homepage/Glance (ADR-006) rather than living alongside them.
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    profiles: ["komodo"]
    depends_on:
      - komodo-core
    environment:
      PERIPHERY_CORE_ADDRESS: "ws://komodo-core:9120"
      PERIPHERY_CONNECT_AS: ${KOMODO_FIRST_SERVER_NAME:-control-plane}
      PERIPHERY_CORE_PUBLIC_KEYS: "file:/config/keys/core.pub"
      PERIPHERY_ROOT_DIRECTORY: ${PERIPHERY_ROOT_DIRECTORY:-/opt/komodo}
    volumes:
      - komodo-keys:/config/keys
      # Direct socket access, read-write — not the read-only proxy pattern
      # used elsewhere in this file. Periphery is Komodo's deploy/build
      # agent: it starts, stops, and builds containers, not just lists them.
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Must be the same path inside and outside the container (Komodo's
      # own requirement — see its docs) — same in/out-path pattern this
      # file already uses for SSH_KEY_PATH above. All Periphery-managed
      # compose files/repos must live under this directory.
      - ${PERIPHERY_ROOT_DIRECTORY:-/opt/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/opt/komodo}

  # This node's central ingress (ADR-006). Previously Traefik lived on a
  # workload node (ADR-001's reference topology); it now runs here instead,
  # reading local container labels directly off the read-only Docker
  # socket, the same pattern already used in vagrant/workload-node's
  # fixture. No docker-socket-proxy in front of it — nothing else on this
  # node still needs the proxy once WUD/Beszel/Dozzle are gone, and
  # Komodo Periphery above needs write access to the raw socket anyway.
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    profiles: ["traefik"]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Cross-node routing (ADR-005 §4's traefik-kop + Redis pattern,
      # re-centered on this node — see ADR-006): traefik-kop instances on
      # other nodes publish their local container labels here instead of
      # to a remote Node B.
      - "--providers.redis=true"
      - "--providers.redis.endpoints=traefik-redis:6379"
      - "--providers.redis.password=${TRAEFIK_REDIS_PASSWORD:-}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Dashboard/API — bound to localhost only below, no auth in front of
      # it (see CLAUDE.md: auth strategy is deferred, server is LAN-only
      # for now). Reach it via an SSH tunnel, not directly over the LAN.
      - "--api.insecure=true"
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Redis backing store for traefik-kop instances on other nodes to publish
  # dynamic routing rules to (see the `traefik` service comment above).
  traefik-redis:
    image: redis:7-alpine
    container_name: traefik-redis
    restart: unless-stopped
    profiles: ["traefik"]
    command: ["redis-server", "--requirepass", "${TRAEFIK_REDIS_PASSWORD:-}"]
    volumes:
      - traefik-redis-data:/data

volumes:
  registry-data:
  komodo-mongo-data:
  komodo-mongo-config:
  komodo-keys:
  komodo-backups:
  traefik-redis-data:
